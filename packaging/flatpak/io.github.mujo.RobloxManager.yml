# The Roblox manager as a Flatpak: one build for every distro, updated with
# the rest of the user's Flatpaks.
#
#   packaging/flatpak/build.sh            build and install for this user
#   packaging/flatpak/build.sh --bundle   also write roblox-manager.flatpak
#
# The Flatpak is for packaging, not confinement: the manager runs Roblox
# clients, finds and stops them on the host, and keeps the same data a
# native install does. The permissions below say so plainly.
#
# Keep in step with the Nix build (package.nix, cordial/package.nix):
#   - Cargo.lock changed  -> regenerate cargo-sources.json
#   - Cordial moved       -> the cordial module below takes the url, commit,
#                            patches and CORDIAL_GIT_SHA from
#                            cordial/source.json (`cargo test` fails until
#                            it does), and cordial-cargo-sources.json is
#                            regenerated from cordial/Cargo.lock
#   - both with flatpak-builder-tools' cargo/flatpak-cargo-generator.py:
#       flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

app-id: io.github.mujo.RobloxManager
# GNOME rather than freedesktop: the window and Cordial's engine window are
# GTK4 + libadwaita, which only the GNOME runtime carries.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# The SDK extensions follow the freedesktop base under GNOME 50, not GNOME's
# number. build.sh reads this line; keep its format.
# sdk-extension-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: roblox-manager

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  # The game clients: GLES/Vulkan, and sound through PulseAudio or PipeWire
  # (Cordial's PipeWire backend speaks the native socket, not Pulse's).
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  # The same accounts, groups, macros and Cordial profiles as a native
  # install (roblox-manager.sh points the XDG homes back at the host's), and
  # the old Cordial Flatpak's data for the one-time migration.
  - --filesystem=home
  # Sessions live in the Secret Service, under the attributes native
  # installs use.
  - --talk-name=org.freedesktop.secrets
  # pgrep and kill on the host: each launch of a Flatpak gets its own process
  # namespace, so clients an earlier launch started are only visible there.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # -- cage: the nested compositor a macro-ready client runs in -------------
  # cage only ever runs nested inside the user's session, but its sources
  # include wlroots' DRM-lease and session headers unconditionally, and
  # wlroots installs those only with its DRM backend and session support.
  # So both are built, with the libraries they need that the runtime lacks
  # (hwdata's PNP ids, libdisplay-info, libseat); libinput stays out.
  - name: hwdata
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --datadir=/app/share
      - make install
    # Read by wlroots' build only.
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://github.com/vcrhonek/hwdata
        tag: v0.390

  - name: libdisplay-info
    buildsystem: meson
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info
        tag: 0.2.0

  - name: seatd
    buildsystem: meson
    config-opts:
      - -Dwerror=false
      - -Dlibseat-logind=disabled
      - -Dlibseat-seatd=enabled
      - -Dlibseat-builtin=disabled
      - -Dserver=disabled
      - -Dman-pages=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://git.sr.ht/~kennylevinsen/seatd
        tag: 0.9.1

  - name: wlroots
    buildsystem: meson
    config-opts:
      - -Dbackends=drm
      - -Dsession=enabled
      - -Dxwayland=disabled
      - -Dexamples=false
      - -Drenderers=gles2
      - -Dallocators=gbm
      - -Dlibliftoff=disabled
      - -Dxcb-errors=disabled
      - -Dcolor-management=disabled
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/wlroots/wlroots/-/archive/0.20.2/wlroots-0.20.2.tar.gz
        sha256: 972c7ac44b17828f4702bfae7cd8347346a3fb5b2c1076cfa2c3fcedac5ec343

  - name: cage
    buildsystem: meson
    config-opts:
      - -Dman-pages=disabled
    sources:
      - type: archive
        url: https://github.com/cage-kiosk/cage/archive/refs/tags/v0.3.1.tar.gz
        sha256: 6dc1619665acd367e0174c93b234002549a66f55f1de9197d67f0305415babc8

  # -- Stacked, mujō's fork of Cordial: cordial-run and cordial-fetch -------
  # The source, commit and patches of cordial/source.json; see
  # cordial/package.nix for what the patches do. Built with clang: AOSP
  # bionic needs its extensions.
  - name: cordial
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        CC: clang
        CXX: clang++
        CARGO_HOME: /run/build/cordial/cargo
        CORDIAL_GIT_SHA: c297d56-mujo
    build-commands:
      # mcpelauncher-linker reaches bionic's headers through symlinks in
      # include/ (android -> ../bionic/libc/include/android/, and eight more).
      # A git that checks them out as plain files (core.symlinks=false, from
      # the mirror's or the user's config) fails the build much later, with
      # "'android/versioning.h' file not found". So check out include/ and
      # the two submodules again with symlinks forced on, and if the header is
      # still missing, show what is there instead of a compiler error.
      - |
        linker=third_party/mcpelauncher-linker
        if [ ! -f "$linker/include/android/versioning.h" ]; then
          git -C "$linker" -c core.symlinks=true checkout -f -- include || true
          git -C "$linker/bionic" -c core.symlinks=true checkout -f -- . || true
          git -C "$linker/core" -c core.symlinks=true checkout -f -- . || true
        fi
        if [ ! -f "$linker/include/android/versioning.h" ]; then
          echo "error: $linker/include/android/versioning.h is missing" >&2
          ls -la "$linker/include" "$linker/bionic/libc/include/android" >&2 || true
          git -C "$linker" config --show-origin --get-all core.symlinks >&2 || true
          exit 1
        fi
      - cargo build --release --offline -p cordial-runtime --bin cordial-run -p cordial-update --bin cordial-fetch
      - install -Dm755 -t /app/bin target/release/cordial-run target/release/cordial-fetch
      - install -Dm644 LICENSE /app/share/licenses/cordial/LICENSE
    sources:
      # Its submodules (mcpelauncher-linker, libjnivm) come in as sources of
      # their own, at the commits the tree pins, as upstream's own Flatpak
      # manifest does: through flatpak-builder's recursive submodule checkout
      # the linker's headers (include/android -> ../bionic/...) were not
      # found. mcpelauncher-linker's own submodules (bionic, core) still come
      # with it.
      - type: git
        url: https://github.com/DamnShabu/stacked
        commit: c297d56832bae8a5666eb04f17e10e7f61cd02e2
        disable-submodules: true
      - type: git
        url: https://github.com/ChristopherHX/libjnivm
        commit: f24b98c198fcc5c59a68d1efadd3f5791eb01c2e
        dest: third_party/libjnivm
      - type: git
        url: https://github.com/minecraft-linux/mcpelauncher-linker
        commit: 1ac3ea6c1cf4f73a84d73f0bff510fba94a7d0f2
        dest: third_party/mcpelauncher-linker
      - type: patch
        path: ../../cordial/0002-cordial-fetch-cli.patch
      - cordial-cargo-sources.json

  # -- the manager ----------------------------------------------------------
  - name: roblox-manager
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/roblox-manager/cargo
    build-commands:
      - cargo build --release --offline -p rbxmgr
      - install -Dm755 target/release/roblox-manager /app/libexec/roblox-manager
      - install -Dm755 packaging/flatpak/roblox-manager.sh /app/bin/roblox-manager
      # The window asks for these names; the launcher's icon must carry the
      # app id to be exported.
      - install -Dm644 packaging/icons/roblox-manager.svg /app/share/icons/hicolor/scalable/apps/roblox-manager.svg
      - install -Dm644 packaging/icons/roblox-manager.svg /app/share/icons/hicolor/scalable/apps/io.github.mujo.RobloxManager.svg
      - install -Dm644 packaging/flatpak/io.github.mujo.RobloxManager.desktop /app/share/applications/io.github.mujo.RobloxManager.desktop
      - install -Dm644 packaging/flatpak/io.github.mujo.RobloxManager.metainfo.xml /app/share/metainfo/io.github.mujo.RobloxManager.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - roblox-manager.flatpak
          - target
          - result
          - docs
      - cargo-sources.json
