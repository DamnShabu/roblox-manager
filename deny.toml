# cargo-deny: what the dependency tree may contain. CI runs
# `cargo deny check` on each pull request and daily (security.yml).

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Every RustSec advisory fails, unmaintained crates included (for every
# crate, not only direct dependencies). An exception goes in `ignore`
# with the reason beside it.
unmaintained = "all"
yanked = "deny"
ignore = [
    # zstd 0.13 / zstd-safe 7, through backhand 0.25.5, which has no release
    # on the fixed zstd 0.14 / zstd-safe 8.2 yet. backhand only decompresses
    # with a fresh `zstd::bulk::Decompressor` per block, and only the Stacked
    # AppImage the manager downloads: no streaming context to reuse, no
    # seekable frames, no streaming legacy frames. Drop these with the bump.
    { id = "RUSTSEC-2026-0391", reason = "streaming context reuse; backhand decompresses in bulk" },
    { id = "RUSTSEC-2026-0398", reason = "zstd Seekable API; never used" },
    { id = "RUSTSEC-2026-0403", reason = "streaming legacy-frame decompression; backhand decompresses in bulk" },
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6. The
    # keyring's D-Bus code is on zbus 5 until it moves; unmaintained, with no
    # vulnerability against them.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; move with the zbus 6 migration" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; move with the zbus 6 migration" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; move with the zbus 6 migration" },
]

[licenses]
# Licenses compatible with shipping the app under MIT: the ones the tree
# has today. A new one is a decision, not a version bump.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
