[package]
name = "rbxmgr-core"
description = "Everything roblox-manager does except drawing: accounts, keyring, Roblox web API, Cordial, launching, macros."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
backhand = { version = "0.23.0", default-features = false, features = ["zstd", "gzip"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["process", "fs", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json"] }
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
