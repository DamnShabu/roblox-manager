[package]
name = "rbxmgr"
description = "roblox-manager: several Roblox accounts, launched into one server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "roblox-manager"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8", "gtk_v4_10"] }
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
glib-unix = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
# Fonts the app ships, added to the font map (FontMap::add_font_file).
pango = { version = "0.22", features = ["v1_56"] }
rbxmgr-core = { path = "../core" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
