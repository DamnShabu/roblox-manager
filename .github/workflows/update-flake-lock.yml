# Once a month, a pull request that moves flake.lock (nixpkgs and
# nix-appimage) forward. Dependabot covers Cargo and the actions.
#
# The pull request is opened with FLAKE_UPDATE_TOKEN, a fine-grained token
# with contents and pull-requests write on this repository: one opened with
# the workflow's own token would not start CI.
name: Update flake.lock

on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          pr-title: "nix: update flake.lock"
          pr-labels: |
            dependencies
            nix
