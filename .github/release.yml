# How `gh release create --generate-notes` (release.yml) sorts a release's
# pull requests, by their labels.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
