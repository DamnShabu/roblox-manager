name: Feature request
description: Something the manager could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, not the solution. "I farm with 8 alts and ..." helps more than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, if you have an idea.
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: Any workaround you use now.
